<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR HTML Executor</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .payment-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .camera-section {
            position: relative;
            width: 100%;
            padding: 20px;
            background: #f5f5f5;
        }

        #video {
            width: 100%;
            border-radius: 12px;
            background: #000;
            display: block;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 240px;
            height: 240px;
            border: 2px solid rgba(102, 126, 234, 0.6);
            border-radius: 12px;
            box-shadow: inset 0 0 40px rgba(102, 126, 234, 0.3);
            pointer-events: none;
        }

        .scanner-overlay::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            width: 30px;
            height: 30px;
            border-top: 3px solid #667eea;
            border-left: 3px solid #667eea;
            border-radius: 4px;
        }

        .scanner-overlay::after {
            content: '';
            position: absolute;
            bottom: -8px;
            right: -8px;
            width: 30px;
            height: 30px;
            border-bottom: 3px solid #667eea;
            border-right: 3px solid #667eea;
            border-radius: 4px;
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            animation: scan 2s infinite;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            50% { transform: translateY(240px); }
            100% { transform: translateY(0); }
        }

        .status-area {
            padding: 20px;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-message {
            font-size: 13px;
            color: #999;
            display: none;
        }

        .status-message.scanning {
            display: block;
            color: #667eea;
            font-weight: 600;
        }

        .status-message.success {
            display: block;
            color: #4caf50;
            font-weight: 600;
        }

        .status-message.error {
            display: block;
            color: #f44336;
            font-weight: 600;
        }

        .result-section {
            padding: 20px;
            border-top: 1px solid #eee;
            display: none;
            min-height: 300px;
        }

        .result-section.active {
            display: block;
        }

        .preview-area {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            overflow: auto;
            background: #fafafa;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-retry {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-retry:active {
            transform: scale(0.98);
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {
            .payment-container {
                border-radius: 12px;
            }

            .header {
                padding: 24px 16px;
            }

            .header h1 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="header">
            <h1>🎯 QR読込み</h1>
            <p>QRコードをカメラに向けてください</p>
        </div>

        <div class="camera-section">
            <video id="video" autoplay playsinline></video>
            <div class="scanner-overlay">
                <div class="scanner-line"></div>
            </div>
            <div class="status-area">
                <div class="status-message scanning">読込中...</div>
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <div class="preview-area" id="previewArea"></div>
            <div class="button-group">
                <button class="btn-retry" onclick="restartScanning()">もう一度スキャン</button>
                <button class="btn-clear" onclick="clearAndReset()">クリア</button>
            </div>
        </div>
    </div>

    <script>
        let stream = null;
        let cameraActive = false;

        async function initCamera() {
            try {
                const video = document.getElementById('video');
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;
                cameraActive = true;
                scanQR(video);
            } catch (err) {
                updateStatus('カメラへのアクセスが拒否されました', 'error');
            }
        }

        function scanQR(video) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            function scan() {
                if (!cameraActive) return;

                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        cameraActive = false;
                        executeQRContent(code.data);
                        return;
                    }
                }

                requestAnimationFrame(scan);
            }

            scan();
        }

        function executeQRContent(data) {
            const trimmedData = data.trim();
            updateStatus('読込完了 ✓', 'success');

            if (trimmedData.startsWith('<') || trimmedData.startsWith('<!')) {
                renderHTML(trimmedData);
            } else if (trimmedData.startsWith('http://') || trimmedData.startsWith('https://')) {
                renderHTML(`<iframe src="${escapeHtml(trimmedData)}" style="width: 100%; height: 100%; border: none;"></iframe>`);
            } else {
                renderHTML(`<pre style="padding: 20px; overflow-x: auto; font-size: 12px;">${escapeHtml(trimmedData)}</pre>`);
            }

            showResultSection();
        }

        function renderHTML(html) {
            const previewArea = document.getElementById('previewArea');
            previewArea.innerHTML = html;

            const scripts = previewArea.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                newScript.textContent = oldScript.textContent;
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        function updateStatus(message, type = 'scanning') {
            const statusEl = document.querySelector('.status-message');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
        }

        function showResultSection() {
            document.getElementById('resultSection').classList.add('active');
        }

        function restartScanning() {
            document.getElementById('resultSection').classList.remove('active');
            cameraActive = true;
            const video = document.getElementById('video');
            scanQR(video);
            updateStatus('読込中...', 'scanning');
        }

        function clearAndReset() {
            document.getElementById('resultSection').classList.remove('active');
            document.getElementById('previewArea').innerHTML = '';
            cameraActive = true;
            const video = document.getElementById('video');
            scanQR(video);
            updateStatus('読込中...', 'scanning');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('load', initCamera);
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
